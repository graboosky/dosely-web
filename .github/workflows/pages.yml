# Builds the static export and publishes it to GitHub Pages on every push to main.
#
# This site exists because App Store review fetches the privacy policy and the terms during
# submission, and a 404 there costs a review cycle (docs/release.md puts web first for that
# reason). So the deploy is automatic: a policy that is only on someone's laptop is a policy
# that is not published.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages serves what it is given verbatim; without this, every path starting with an
      # underscore — which is most of Next's output — is dropped by Jekyll.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
